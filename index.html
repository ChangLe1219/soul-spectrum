/* ============ 状态 ============ */

const BASE_N = BASE.length;
const DEEP_N = 6;
const TOTAL = BASE_N + DEEP_N;
const DIM_NAMES = { rom:'浪漫', rea:'务实', sta:'安稳', ind:'独立', war:'温暖', app:'颜值' };

let QUESTIONS = BASE.slice();
let answers = new Array(TOTAL).fill(-1);
let idx = 0;
let animating = false;

const $ = id => document.getElementById(id);

/* ============ 评分 ============ */

const maxSum = {};
for (const d of DIMS) maxSum[d] = 0;
for (const item of QUESTIONS) for (const d of DIMS) {
  let m = 0;
  for (const o of item.o) if (o.w[d] > m) m = o.w[d];
  maxSum[d] += m;
}

function calcDims() {
  const sums = { rom:0, rea:0, sta:0, ind:0, war:0, app:0 };
  for (let i = 0; i < TOTAL; i++) {
    if (answers[i] < 0) continue;
    const w = QUESTIONS[i].o[answers[i]].w;
    for (const d of DIMS) if (w[d]) sums[d] += w[d];
  }
  return DIMS.map(d => Math.min(100, Math.round(sums[d] / maxSum[d] * 100)));
}

function classify(dims) {
  let best = 0, bestScore = -1;
  for (let t = 0; t < TYPES.length; t++) {
    let diff = 0;
    for (let i = 0; i < 6; i++) diff += Math.abs(dims[i] - TYPES[t].ideal[i]);
    const score = 100 - diff / 6;
    if (score > bestScore) { bestScore = score; best = t; }
  }
  return best;
}

function encodeResult(t, dims) {
  let s = t.toString(36);
  for (const d of dims) s += d.toString(36).padStart(2, '0');
  return s;
}

/* ============ 深挖注入:基础题答完后,按倾向追加 ============ */

function injectDeep() {
  const sums = { rom:0, rea:0, sta:0, ind:0, war:0, app:0 };
  for (let i = 0; i < BASE_N; i++) {
    const w = BASE[i].o[answers[i]].w;
    for (const d of DIMS) if (w[d]) sums[d] += w[d];
  }
  const ranked = DIMS.slice().sort((a, b) => sums[b] - sums[a] || Math.random() - .5);
  const d1 = ranked[0], d2 = ranked[1];
  const pool = [];
  for (let i = 0; i < 3; i++) {
    pool.push(DEEP[d1][i]);
    pool.push(DEEP[d2][i]);
  }
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  QUESTIONS = QUESTIONS.concat(pool);
  for (const item of pool) for (const d of DIMS) {
    let m = 0;
    for (const o of item.o) if (o.w[d] > m) m = o.w[d];
    maxSum[d] += m;
  }
}

/* ============ 动态背景(中性,渐暖) ============ */

const canvas = $('bg');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const COLD = [[96,64,190],[70,110,220],[130,80,200]];
const WARM = [[255,96,120],[255,150,90],[210,90,180]];
let warmth = 0;
let warmthTarget = 0;

const BLOBS = [
  { hx:.72, hy:.30, ax:.22, ay:.19, spd:.30, rBase:.30, seed:1.7 },
  { hx:.26, hy:.68, ax:.16, ay:.15, spd:.18, rBase:.34, seed:4.2 },
  { hx:.55, hy:.88, ax:.24, ay:.12, spd:.24, rBase:.26, seed:8.9 }
];

const mix = (a, b, t) => a + (b - a) * t;

const PARTICLE_N = 90;
const particles = [];
function respawn(p) {
  p.x = Math.random() * W; p.y = H + 10 + Math.random() * 40;
  p.vx = (Math.random() - .5) * 8; p.vy = -(6 + Math.random() * 13);
  p.r = .6 + Math.random() * 1.8; p.ph = Math.random() * Math.PI * 2;
  p.spd = .8 + Math.random() * 2.2;
}
for (let i = 0; i < PARTICLE_N; i++) { const p = {}; respawn(p); p.y = Math.random() * H; particles.push(p); }

function rgba(c, a) { return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }

let lastFrame = performance.now();
function frame(now) {
  const t = now / 1000;
  const dt = Math.min(.05, (now - lastFrame) / 1000);
  lastFrame = now;
  warmth += (warmthTarget - warmth) * Math.min(1, dt * 1.6);

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#07060d';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  const colors = [];
  for (let i = 0; i < 3; i++) colors.push([
    mix(COLD[i][0], WARM[i][0], warmth),
    mix(COLD[i][1], WARM[i][1], warmth),
    mix(COLD[i][2], WARM[i][2], warmth)
  ]);

  const minDim = Math.min(W, H);
  for (const b of BLOBS) {
    const x = b.hx * W + Math.sin(t * b.spd + b.seed) * b.ax * W;
    const y = b.hy * H + Math.cos(t * b.spd * 1.2 + b.seed * 1.3) * b.ay * H;
    const r = minDim * b.rBase * (1 + .04 * Math.sin(t * .8 + b.seed));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(colors[0], .30));
    g.addColorStop(.55, rgba(colors[1], .12));
    g.addColorStop(1, rgba(colors[2], 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y < -14 || p.x < -14 || p.x > W + 14) respawn(p);
    const tw = .45 + .55 * Math.sin(t * p.spd + p.ph);
    const ci = (((p.x | 0) + (p.y | 0)) % 3 + 3) % 3;
    ctx.fillStyle = rgba(colors[ci], .35 * tw);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.classList.remove('active');
  $(id).classList.add('active');

}

/* ============ 流程 ============ */

function renderQuestion() {
  const item = QUESTIONS[idx];
  $('q-count').textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(TOTAL).padStart(2, '0');
  $('q-progress').style.width = (idx / TOTAL * 100) + '%';
  $('q-text').textContent = item.q;
  const opts = $('opts');
  opts.innerHTML = '';
  const keys = ['A', 'B', 'C', 'D'];
  item.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt'; btn.type = 'button';
    btn.innerHTML = `<span class="k">${keys[i]}</span><span>${opt.t}</span>`;
    btn.addEventListener('click', () => choose(i, btn));
    opts.appendChild(btn);
  });
  $('btn-back').disabled = idx === 0;
}

function choose(i, btn) {
  if (animating) return;
  animating = true;
  answers[idx] = i;
  btn.classList.add('chosen');
  setTimeout(() => {
    animating = false;
    idx++;
    warmthTarget = Math.min(1, idx / TOTAL);
    if (idx === BASE_N && QUESTIONS.length === BASE_N) injectDeep();
    if (idx >= TOTAL) showResult();
    else renderQuestion();
  }, 240);
}

function goBack() {
  if (animating || idx === 0) return;
  idx--;
  warmthTarget = Math.min(1, idx / TOTAL);
  renderQuestion();
}

/* ============ 结果(中性) ============ */

function showResult() {
  const dims = calcDims();
  const t = classify(dims);
  const T = TYPES[t];
  const code = encodeResult(t, dims);

  document.documentElement.style.setProperty('--accent', T.color);

  $('r-swatch').style.background = `radial-gradient(circle at 35% 35%, #ffffff22, transparent 40%), ${T.color}`;
  $('r-swatch').style.color = T.color;
  $('r-name').textContent = T.name;
  $('r-name').style.color = T.color;
  $('r-name').style.textShadow = `0 0 46px ${T.color}66`;
  $('r-en').textContent = `${T.en} · ${T.tagline}`;
  const desc = $('r-desc');
  desc.innerHTML = '';
  for (const p of T.desc) { const el = document.createElement('p'); el.textContent = p; desc.appendChild(el); }
  $('r-code').textContent = code;
  show('screen-result');
  warmthTarget = 1;
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((res, rej) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); res(); }
    catch (e) { rej(e); }
    finally { ta.remove(); }
  });
}

$('btn-copy').addEventListener('click', () => {
  copyText(shareText).then(() => {
    const btn = $('btn-copy'); const old = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => { btn.textContent = old; }, 1600);
  }).catch(() => alert('复制失败,请手动复制'));
});

    for (const o of item.o) if (o.w[d] > m) m = o.w[d];
    maxSum[d] += m;
  }
  document.documentElement.style.setProperty('--accent', '#8a81b1');
  show('screen-intro');
});

/* ============ 启动 ============ */

$('btn-start').addEventListener('click', () => { idx = 0; renderQuestion(); show('screen-quiz'); });
$('btn-back').addEventListener('click', goBack);

window.addEventListener('keydown', e => {
  if (!$('screen-quiz').classList.contains('active')) return;
  if (e.key === 'Backspace') { e.preventDefault(); goBack(); return; }
  const map = { '1':0, '2':1, '3':2, '4':3, 'a':0, 'b':1, 'c':2, 'd':3 };
  const i = map[e.key.toLowerCase()];
  if (i !== undefined && i < QUESTIONS[idx].o.length) {
    const btn = $('opts').children[i];
    if (btn) choose(i, btn);
  }
});
</script>

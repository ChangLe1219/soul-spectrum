<html lang="zh-CN">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent-rgb: 136, 129, 177;
    --accent: rgb(136, 129, 177);
    --tempo: 300;
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: #05060b;
    color: #e8eaf2;
    overflow-x: hidden;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif; }

  #bg { position: fixed; inset: 0; z-index: 0; display: block; }
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 48%, rgba(3, 4, 9, .62) 100%);
  }

  #app {
    position: relative; z-index: 2; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 44px 18px;
  }
  .screen { display: none; width: 100%; max-width: 680px; }
  .screen.active { display: block; animation: screenIn .55s cubic-bezier(.2, .7, .3, 1) both; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .card {
    background: rgba(10, 12, 20, .58);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 20px;
    padding: clamp(26px, 5vw, 52px);
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .8), 0 0 90px -30px rgba(var(--accent-rgb), .32);
  }

  /* ---------- intro ---------- */
  .intro { text-align: center; }
  .intro .eyebrow {
    font-size: 12px; letter-spacing: .5em; text-indent: .5em;
    color: rgba(232, 234, 242, .45); margin-bottom: 22px;
  }
  .intro h1 {
    font-size: clamp(42px, 9vw, 74px); font-weight: 700; letter-spacing: .12em;
    line-height: 1.15;
    background: linear-gradient(120deg, #ffffff 30%, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .intro .sub {
    margin-top: 18px; font-size: clamp(14px, 2.4vw, 16px);
    color: rgba(232, 234, 242, .72); letter-spacing: .08em;
  }
  .intro .notes {
    list-style: none; margin: 34px auto 0; max-width: 420px; text-align: left;
    display: flex; flex-direction: column; gap: 12px;
  }
  .intro .notes li {
    font-size: 14px; line-height: 1.7; color: rgba(232, 234, 242, .55);
    padding-left: 20px; position: relative;
  }
  .intro .notes li::before {
    content: ""; position: absolute; left: 0; top: .72em;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb), .9);
  }
  .intro .start-wrap { margin-top: 44px; }
  .intro .tiny { margin-top: 26px; font-size: 12px; color: rgba(232, 234, 242, .3); letter-spacing: .1em; }
  .rise { opacity: 0; animation: rise .9s cubic-bezier(.2, .7, .3, 1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .btn-primary {
    display: inline-block; border: none; cursor: pointer;
    background: linear-gradient(135deg, rgba(var(--accent-rgb), .95), rgba(var(--accent-rgb), .6));
    color: #0a0b12; font-weight: 700; letter-spacing: .25em; text-indent: .25em;
    padding: 16px 48px; border-radius: 999px; font-size: 15px;
    transition: transform .22s ease, box-shadow .22s ease;
    box-shadow: 0 8px 30px -8px rgba(var(--accent-rgb), .5);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 44px -10px rgba(var(--accent-rgb), .6); }
  .btn-primary:active { transform: translateY(0) scale(.98); }

  /* ---------- quiz ---------- */
  .q-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .q-count { font-variant-numeric: tabular-nums; letter-spacing: .18em; color: rgba(232, 234, 242, .45); font-size: 13px; }
  .q-hint { font-size: 11px; letter-spacing: .35em; color: rgba(var(--accent-rgb), .85); text-transform: uppercase; }
  .progress { height: 3px; background: rgba(255, 255, 255, .07); border-radius: 99px; overflow: hidden; margin-bottom: 34px; }
  .progress i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, rgba(var(--accent-rgb), .45), var(--accent));
    border-radius: 99px;
    transition: width .5s cubic-bezier(.2, .8, .2, 1), background .6s ease;
  }
  .q-text { font-size: clamp(20px, 3.4vw, 25px); line-height: 1.65; margin-bottom: 30px; font-weight: 600; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; align-items: flex-start; gap: 14px; text-align: left; width: 100%;
    padding: 14px 18px; border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, .09);
    background: rgba(255, 255, 255, .028);
    color: #d9dde9; font-size: 15px; line-height: 1.6; cursor: pointer;
    font-family: inherit;
    transition: transform calc(var(--tempo) * 1ms) ease, border-color .25s, background .25s;
  }
  .opt .k {
    flex: 0 0 auto; width: 27px; height: 27px; margin-top: 1px; border-radius: 8px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), .35);
    transition: color .25s, border-color .25s;
  }
  .opt:hover { border-color: rgba(var(--accent-rgb), .55); background: rgba(var(--accent-rgb), .07); transform: translateX(6px); }
  .opt:active { transform: scale(.985); }
  .opt.chosen {
    border-color: rgba(var(--accent-rgb), .9);
    background: rgba(var(--accent-rgb), .14);
    transform: translateX(6px);
  }
  .q-nav { margin-top: 28px; display: flex; justify-content: space-between; align-items: center; }
  .back-btn {
    background: none; border: none; cursor: pointer; color: rgba(232, 234, 242, .4);
    font-size: 13px; letter-spacing: .1em; padding: 6px 0; transition: color .2s; font-family: inherit;
  }
  .back-btn:hover { color: rgba(232, 234, 242, .85); }
  .back-btn[disabled] { opacity: 0; pointer-events: none; }
  .kbd-hint { font-size: 12px; color: rgba(232, 234, 242, .28); letter-spacing: .05em; }

  /* ---------- result ---------- */
  .result { text-align: center; }
  .r-eyebrow { font-size: 12px; letter-spacing: .5em; text-indent: .5em; color: rgba(232, 234, 242, .45); }
  .r-swatch {
    width: 66px; height: 66px; border-radius: 50%; margin: 26px auto 20px;
    box-shadow: 0 0 60px -6px currentColor;
    animation: breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  .r-name {
    font-size: clamp(46px, 10vw, 72px); font-weight: 700; letter-spacing: .1em; line-height: 1.2;
  }
  .r-en { margin-top: 10px; font-size: 13px; letter-spacing: .5em; text-indent: .5em; color: rgba(232, 234, 242, .5); }
  .r-formula { margin-top: 20px; font-size: 15px; letter-spacing: .06em; color: rgba(232, 234, 242, .75); }
  .spectrum {
    display: flex; height: 10px; border-radius: 99px; overflow: hidden; margin: 26px auto 0;
    max-width: 420px; background: rgba(255, 255, 255, .06);
  }
  .spectrum i { display: block; height: 100%; transition: width 1s cubic-bezier(.2, .8, .2, 1); }
  .r-desc { margin-top: 34px; text-align: left; }
  .r-desc p { font-size: 15px; line-height: 2.05; color: rgba(232, 234, 242, .82); }
  .r-desc p + p { margin-top: 14px; }
  .r-blind {
    margin-top: 26px; text-align: left; padding: 16px 18px;
    border-left: 2px solid var(--accent);
    background: rgba(var(--accent-rgb), .06);
    border-radius: 0 12px 12px 0;
    font-size: 14px; line-height: 1.9; color: rgba(232, 234, 242, .68);
  }
  .r-bars { margin-top: 36px; display: flex; flex-direction: column; gap: 14px; }
  .bar-row { display: grid; grid-template-columns: 52px 1fr 48px; align-items: center; gap: 14px; }
  .bar-name { font-size: 14px; color: rgba(232, 234, 242, .75); letter-spacing: .1em; text-align: left; }
  .bar-track { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .07); overflow: hidden; }
  .bar-track i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
  .bar-pct { font-variant-numeric: tabular-nums; font-size: 13px; color: rgba(232, 234, 242, .6); text-align: right; }
  .r-quote {
    margin-top: 36px; padding: 22px 8px; text-align: center;
    font-size: 15px; line-height: 2; color: rgba(232, 234, 242, .62);
    border-top: 1px solid rgba(255, 255, 255, .07);
    border-bottom: 1px solid rgba(255, 255, 255, .07);
  }
  .r-quote b { color: var(--accent); font-weight: 600; letter-spacing: .15em; }
  .r-actions { margin-top: 36px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn-ghost {
    border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .03);
    color: #d9dde9; cursor: pointer; padding: 13px 30px; border-radius: 999px;
    font-size: 14px; letter-spacing: .12em; font-family: inherit;
    transition: border-color .25s, background .25s, transform .2s;
  }
  .btn-ghost:hover { border-color: rgba(var(--accent-rgb), .6); background: rgba(var(--accent-rgb), .08); transform: translateY(-1px); }
  .r-tiny { margin-top: 24px; font-size: 12px; color: rgba(232, 234, 242, .3); letter-spacing: .1em; }

  @media (max-width: 480px) {
    .bar-row { grid-template-columns: 44px 1fr 42px; gap: 10px; }
    .kbd-hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="vignette"></div>

<main id="app">

  <section id="screen-intro" class="screen active">
    <div class="card intro">
      <div class="eyebrow rise" style="animation-delay:.05s">SOUL SPECTRUM</div>
      <h1 class="serif rise" style="animation-delay:.2s">灵魂光谱</h1>
      <p class="sub rise" style="animation-delay:.4s">一份关于你是什么样的人的测试</p>
      <ul class="notes rise" style="animation-delay:.6s">
        <li>24 道题,约五分钟</li>
        <li>没有对错,凭第一感觉作答</li>
        <li>背景会随你的选择慢慢变化——那是正在显影的你</li>
      </ul>
      <div class="start-wrap rise" style="animation-delay:.8s">
        <button class="btn-primary" id="btn-start">开始测试</button>
      </div>
      <p class="tiny rise" style="animation-delay:1s">结果仅供自我观察,不构成任何定义</p>
    </div>
  </section>

  <section id="screen-quiz" class="screen">
    <div class="card">
      <div class="q-top">
        <span class="q-count" id="q-count">01 / 24</span>
        <span class="q-hint" id="q-hint">正在显影</span>
      </div>
      <div class="progress"><i id="q-progress"></i></div>
      <h2 class="q-text serif" id="q-text"></h2>
      <div class="opts" id="opts"></div>
      <div class="q-nav">
        <button class="back-btn" id="btn-back">← 上一题</button>
        <span class="kbd-hint">键盘 1–4 作答 · Backspace 返回</span>
      </div>
    </div>
  </section>

  <section id="screen-result" class="screen">
    <div class="card result">
      <div class="r-eyebrow">你的灵魂光谱</div>
      <div class="r-swatch" id="r-swatch"></div>
      <div class="r-name serif" id="r-name"></div>
      <div class="r-en" id="r-en"></div>
      <div class="r-formula" id="r-formula"></div>
      <div class="spectrum" id="spectrum"></div>
      <div class="r-desc" id="r-desc"></div>
      <div class="r-blind" id="r-blind"></div>
      <div class="r-bars" id="r-bars"></div>
      <div class="r-quote" id="r-quote"></div>
      <div class="r-actions">
        <button class="btn-ghost" id="btn-copy">复制结果</button>
        <button class="btn-ghost" id="btn-restart">再测一次</button>
      </div>
      <p class="r-tiny">感谢你的 24 个答案 · 光谱会记住这一刻的你</p>
    </div>
  </section>

</main>

<script>
'use strict';

/* ============ 数据 ============ */

const TYPES = {
  fire: {
    name: '烈焰', en: 'THE EMBER', color: '#ff5a3c',
    rgb: [255, 90, 60], tagline: '炽热 · 直接 · 行动',
    desc: [
      '你的人生动词是「去」。想和做之间,你的距离最短。别人还在权衡,你已经上路;别人开始后悔,你已经在改。你相信速度本身就是一种诚实——喜欢就说,想要就追,不满就讲出来。',
      '你的热烈不是表演,是体温。靠近你的人会被点燃,远离你的人说你危险——你两种都不太在乎。'
    ],
    blind: '你的盲点:偶尔会把「快」当成「对」,把沉默当成敌意。有些人和事,要慢下来才看得清。',
    advice: '保留你的速度,练习你的刹车。',
    secondary: '你的火焰之下,始终留着这簇不灭——它在你最冷静的决断里,偶尔亮一下。'
  },
  sea: {
    name: '深海', en: 'THE ABYSS', color: '#3f6dff',
    rgb: [63, 109, 255], tagline: '冷静 · 深度 · 秩序',
    desc: [
      '你习惯在下潜中思考。表面平静,底下有洋流。你不是没有情绪,只是每个情绪都要先过一遍审判;你不是不合群,只是热闹需要先过滤一遍,才轮得到你。',
      '别人看到你的安静,看不到你脑内彻夜的推演。你的决定往往做得很慢,但一旦做出,几乎不回头。'
    ],
    blind: '你的盲点:有时会用「想清楚」拖住「做出来」。窗外的世界,不会等你算完所有变量。',
    advice: '保留你的深度,练习你的浮出。',
    secondary: '你的底层沉着一整片深海:所有炽热与柔软,最终都会沉回这片秩序里。'
  },
  star: {
    name: '星尘', en: 'THE NEBULA', color: '#b46bff',
    rgb: [180, 107, 255], tagline: '想象 · 敏感 · 独特',
    desc: [
      '你的世界,比别人多一层滤镜。同一条街,你能看到别人看不到的光;同一件小事,能在你心里余震很久。你收藏奇怪的东西,问奇怪的问题,在深夜突然想通一个没人讨论的道理。',
      '你和世界之间始终隔着一层玻璃——这让你偶尔孤独,也让你独一无二。'
    ],
    blind: '你的盲点:想太多是你的天赋,也是你的税。有些事,做完了才算发生过。',
    advice: '保留你的想象,练习你的落地。',
    secondary: '你的缝隙里撒着星尘:它们负责你的奇思,和那些没说出口的浪漫。'
  },
  moss: {
    name: '苔原', en: 'THE GROVE', color: '#2fd48a',
    rgb: [47, 212, 138], tagline: '温厚 · 稳定 · 守护',
    desc: [
      '你是会被写进别人「感谢名单」的那种人。你记得谁的口味、谁的忌口、谁上次随口说的那句话。你的爱不喧哗,是具体的:一杯顺手的热水,一句「到家了吗」。',
      '别人追逐浪,你是海底——不动声色地托住很多东西。只是你不说,所以很少有人知道,你也需要被托住一次。'
    ],
    blind: '你的盲点:把「为别人好」排在「为自己好」前面太久了。稳定,不该以自我忽略为代价。',
    advice: '保留你的温柔,练习你的拒绝。',
    secondary: '你的根系里缠着苔原:无论飞多远,你最终都会回到人的身上。'
  }
};
const TYPE_KEYS = ['fire', 'sea', 'star', 'moss'];
const TEMPO = { fire: 150, sea: 340, star: 230, moss: 420 };

const QUESTIONS = [
  { q: '周五晚上,朋友临时叫你出门,而你已换好睡衣瘫在沙发上——', o: [
    { t: '换回去,出门,夜晚才刚开始', w: { fire: 3 } },
    { t: '先问清楚:都有谁、去哪、几点散', w: { sea: 2, fire: 1 } },
    { t: '假装没看见,脑内已经演完了聚会全程', w: { star: 2, sea: 1 } },
    { t: '回一句「下次吧」,顺手给他们点奶茶外卖', w: { moss: 3 } }
  ]},
  { q: '你更害怕哪一种人生?', o: [
    { t: '一眼望到头的安稳', w: { fire: 2, star: 1 } },
    { t: '突如其来的失控', w: { sea: 2, moss: 1 } },
    { t: '成为毫无特点的背景板', w: { star: 3 } },
    { t: '被信任的人狠狠辜负', w: { moss: 3 } }
  ]},
  { q: '你的手机相册里,最多的是?', o: [
    { t: '各种截图:待办、攻略、聊天记录', w: { sea: 3 } },

    { t: '和朋友家人的连拍合影', w: { moss: 3 } },

    { t: '早就准备好了,安静地等它到来', w: { moss: 1, sea: 2 } }

    { t: '郊外小屋,院子里种满植物', w: { moss: 3 } },
    { t: '哪都行,墙要能挂满我收集的东西', w: { star: 2, moss: 1 } },
    { t: '一间书房、一张床,足够', w: { sea: 3 } }

  { q: '和人观点激烈冲突时,你倾向于?', o: [

    { t: '换个话题,气氛比输赢重要', w: { moss: 3 } }
  ]},
  { q: '你的口头禅更接近?', o: [
    { t: '「先干了再说」', w: { fire: 3 } },
    { t: '「让我想想」', w: { sea: 3 } },
    { t: '「你有没有想过一种可能……」', w: { star: 2, sea: 1 } },
    { t: '「没事,慢慢来」', w: { moss: 3 } }
  ]},
  { q: '如果有一次「无代价重来」的机会,你会重选?', o: [
    { t: '某个没敢开口的瞬间', w: { star: 2, moss: 1 } },

  ]},

  ]},

/* ============ 状态 ============ */

const TOTAL = QUESTIONS.length;
let answers = new Array(TOTAL).fill(-1);
let idx = 0;
let animating = false;

const $ = id => document.getElementById(id);
const root = document.documentElement;

/* ============ 计分 ============ */

function scores() {
  const s = { fire: 0, sea: 0, star: 0, moss: 0 };
  for (let i = 0; i < idx; i++) {
    const oi = answers[i];
    if (oi < 0) continue;
    const w = QUESTIONS[i].o[oi].w;
    for (const k of TYPE_KEYS) if (w[k]) s[k] += w[k];
  }
  return s;
}

function weights() {
  const s = scores();
  const total = TYPE_KEYS.reduce((a, k) => a + s[k], 0);
  if (total === 0) return { fire: .25, sea: .25, star: .25, moss: .25 };
  const w = {};
  for (const k of TYPE_KEYS) w[k] = s[k] / total;
  return w;
}

function dominantOf(w) {
  let best = TYPE_KEYS[0];
  for (const k of TYPE_KEYS) if (w[k] > w[best]) best = k;
  return best;
}

function optionDom(w) {
  let best = null;
  for (const k in w) if (best === null || w[k] > w[best]) best = k;
  return best;
}

/* ============ 主题色 ============ */

let lastThemeUpdate = 0;
function applyTheme(t) {
  if (t - lastThemeUpdate < .15) return;
  lastThemeUpdate = t;
  const w = displayWeights;
  let r = 0, g = 0, b = 0;
  for (const k of TYPE_KEYS) {
    const c = TYPES[k].rgb;
    r += c[0] * w[k]; g += c[1] * w[k]; b += c[2] * w[k];
  }
  root.style.setProperty('--accent-rgb', `${r | 0},${g | 0},${b | 0}`);
  root.style.setProperty('--accent', `rgb(${r | 0},${g | 0},${b | 0})`);
  root.style.setProperty('--tempo', TEMPO[dominantOf(w)]);
}

/* ============ 动态背景 ============ */

const canvas = $('bg');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const BLOB_DEFS = {
  fire: { home: [.72, .28], ampX: .24, ampY: .2, spd: .5,  rBase: .3 },
  sea:  { home: [.26, .7 ], ampX: .15, ampY: .13, spd: .1,  rBase: .34 },
  star: { home: [.72, .72], ampX: .3,  ampY: .24, spd: .26, rBase: .27, liss: 1.7 },
  moss: { home: [.28, .24], ampX: .1,  ampY: .09, spd: .05, rBase: .3 }
};
const blobSeeds = {};
for (const k of TYPE_KEYS) blobSeeds[k] = Math.random() * 100;

const displayWeights = { fire: .25, sea: .25, star: .25, moss: .25 };
const pulses = { fire: 0, sea: 0, star: 0, moss: 0 };

function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

function drawBlob(x, y, r, rgb, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(rgb, alpha));
  g.addColorStop(.55, rgba(rgb, alpha * .42));
  g.addColorStop(1, rgba(rgb, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

const PARTICLE_N = 110;
const particles = [];
function respawnParticle(p) {
  p.x = Math.random() * W;
  p.y = H + 10 + Math.random() * 40;
  p.vx = (Math.random() - .5) * 8;
  p.vy = -(6 + Math.random() * 14);
  p.r = .6 + Math.random() * 1.9;
  p.phase = Math.random() * Math.PI * 2;
  p.spd = .8 + Math.random() * 2.4;
  // 按当前显影比例分配颜色
  const w = displayWeights;
  let roll = Math.random(), acc = 0;
  p.type = TYPE_KEYS[TYPE_KEYS.length - 1];
  for (const k of TYPE_KEYS) { acc += w[k]; if (roll <= acc) { p.type = k; break; } }
}
for (let i = 0; i < PARTICLE_N; i++) {
  const p = {};
  respawnParticle(p);
  p.y = Math.random() * H;
  particles.push(p);
}

function renderBg(t, dt) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#05060b';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  const minDim = Math.min(W, H);

  for (const k of TYPE_KEYS) {
    const def = BLOB_DEFS[k];
    const w = displayWeights[k];
    const pulse = pulses[k];
    let x = def.home[0] * W + Math.sin(t * def.spd + blobSeeds[k]) * def.ampX * W;
    let y = def.home[1] * H + Math.sin(t * def.spd * (def.liss || 1) + blobSeeds[k] * 1.3) * def.ampY * H;
    if (k === 'fire') {
      x += (Math.sin(t * 6.3 + blobSeeds[k] * 5) + Math.sin(t * 9.7)) * 16;
      y += Math.cos(t * 5.1 + blobSeeds[k] * 3) * 14;
    }
    let r = minDim * def.rBase * (.45 + w * 1.9);
    if (k === 'fire') r *= 1 + .05 * Math.sin(t * 8);
    r *= 1 + pulse * .3;
    const alpha = .1 + w * .55 + pulse * .5;
    drawBlob(x, y, r, TYPES[k].rgb, alpha);
  }

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.y < -14 || p.x < -14 || p.x > W + 14) respawnParticle(p);
    const tw = .45 + .55 * Math.sin(t * p.spd + p.phase);
    const w = displayWeights[p.type];
    const a = Math.min(.9, tw * (.32 + w * 1.5));
    if (a < .02) continue;
    ctx.fillStyle = rgba(TYPES[p.type].rgb, a);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

let lastFrame = performance.now();
function frame(now) {
  const t = now / 1000;
  const dt = Math.min(.05, (now - lastFrame) / 1000);
  lastFrame = now;

  const target = weights();
  const lerp = Math.min(1, dt * 2.2);
  for (const k of TYPE_KEYS) displayWeights[k] += (target[k] - displayWeights[k]) * lerp;
  for (const k of TYPE_KEYS) pulses[k] = Math.max(0, pulses[k] - dt * 1.6);

  renderBg(t, dt);
  applyTheme(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============ 屏幕切换 ============ */

function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.classList.remove('active');
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* ============ 测试流程 ============ */

const HINTS = ['正在显影', '轮廓渐起', '色彩浮动', '光影成形', '即将成像'];

function renderQuestion() {
  const item = QUESTIONS[idx];
  $('q-count').textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(TOTAL).padStart(2, '0');
  $('q-progress').style.width = (idx / TOTAL * 100) + '%';
  const w = weights();
  const dom = dominantOf(w);
  const pct = Math.round(w[dom] * 100);
  const phase = HINTS[Math.min(HINTS.length - 1, Math.floor(idx / (TOTAL / HINTS.length)))];
  $('q-hint').textContent = `${TYPES[dom].name} ${pct}% · ${phase}`;

  $('q-text').textContent = item.q;

  const opts = $('opts');
  opts.innerHTML = '';
  const keys = ['A', 'B', 'C', 'D'];
  item.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.type = 'button';
    btn.innerHTML = `<span class="k">${keys[i]}</span><span>${opt.t}</span>`;
    btn.addEventListener('click', e => choose(i, btn));
    opts.appendChild(btn);
  });
  $('btn-back').disabled = idx === 0;
}

function choose(i, btn) {
  if (animating) return;
  animating = true;
  answers[idx] = i;
  const dom = optionDom(QUESTIONS[idx].o[i].w);
  pulses[dom] = 1;

  btn.classList.add('chosen');
  setTimeout(() => {
    animating = false;
    idx++;
    if (idx >= TOTAL) showResult();
    else { renderQuestion(); show('screen-quiz'); }
  }, 230);
}

function goBack() {
  if (animating || idx === 0) return;
  idx--;
  renderQuestion();
  show('screen-quiz');
}

/* ============ 结果 ============ */

function buildResult() {
  const s = scores();
  const total = TYPE_KEYS.reduce((a, k) => a + s[k], 0);
  const ranked = TYPE_KEYS.map(k => ({ k, raw: s[k], pct: Math.round(s[k] / total * 100) }));
  ranked.sort((a, b) => b.raw - a.raw);
  // 修正取整误差
  const diff = 100 - ranked.reduce((a, r) => a + r.pct, 0);
  ranked[0].pct += diff;
  return ranked;
}

function showResult() {
  const ranked = buildResult();
  const top = ranked[0], second = ranked[1];
  const T = TYPES[top.k];

  $('r-swatch').style.background = `radial-gradient(circle at 35% 35%, #ffffff22, transparent 40%), ${T.color}`;
  $('r-swatch').style.color = T.color;
  $('r-name').textContent = T.name;
  $('r-name').style.color = T.color;
  $('r-name').style.textShadow = `0 0 46px ${T.color}66`;
  $('r-en').textContent = `${T.en} · ${T.tagline}`;
  $('r-formula').textContent = `${top.pct}% ${T.name} × ${second.pct}% ${TYPES[second.k].name}`;

  const spectrum = $('spectrum');
  spectrum.innerHTML = '';
  for (const r of ranked) {
    const seg = document.createElement('i');
    seg.style.background = TYPES[r.k].color;
    spectrum.appendChild(seg);
    requestAnimationFrame(() => requestAnimationFrame(() => { seg.style.width = r.pct + '%'; }));
  }

  const desc = $('r-desc');
  desc.innerHTML = '';
  for (const p of T.desc) {
    const el = document.createElement('p');
    el.textContent = p;
    desc.appendChild(el);
  }
  $('r-blind').textContent = T.blind;

  const bars = $('r-bars');
  bars.innerHTML = '';
  for (const r of ranked) {
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML =
      `<span class="bar-name">${TYPES[r.k].name}</span>` +
      `<div class="bar-track"><i style="background:linear-gradient(90deg,${TYPES[r.k].color}88,${TYPES[r.k].color})"></i></div>` +
      `<span class="bar-pct">${r.pct}%</span>`;
    bars.appendChild(row);
    const fill = row.querySelector('.bar-track i');
    requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = r.pct + '%'; }));
  }

  const quote = $('r-quote');
  quote.innerHTML = `隐性底色 · ${TYPES[second.k].name}<br>${TYPES[second.k].secondary}<br><br><b>${T.advice}</b>`;

  show('screen-result');
}

/* ============ 复制 / 重来 ============ */

let shareText = '';

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((res, rej) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); res(); }
    catch (e) { rej(e); }
    finally { ta.remove(); }
  });
}

$('btn-copy').addEventListener('click', () => {
  copyText(shareText).then(() => {
    const btn = $('btn-copy');
    const old = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => { btn.textContent = old; }, 1600);
  }).catch(() => alert('复制失败,请手动复制结果文字'));
});

$('btn-restart').addEventListener('click', () => {
  answers = new Array(TOTAL).fill(-1);
  idx = 0;
  show('screen-intro');
});

/* ============ 启动 ============ */

$('btn-start').addEventListener('click', () => {
  idx = 0;
  renderQuestion();
  show('screen-quiz');
});

$('btn-back').addEventListener('click', goBack);

window.addEventListener('keydown', e => {
  if (!$('screen-quiz').classList.contains('active')) return;
  if (e.key === 'Backspace') { e.preventDefault(); goBack(); return; }
  const map = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
  const i = map[e.key.toLowerCase()];
  if (i !== undefined && i < QUESTIONS[idx].o.length) {
    const btn = $('opts').children[i];
    if (btn) choose(i, btn);
  }
});

// 观察结果以供复制
const origShowResult = showResult;
showResult = function () {
  origShowResult();
  const ranked = buildResult();
  const top = ranked[0], second = ranked[1];
  shareText =
    `我的灵魂光谱:「${TYPES[top.k].name}」${top.pct}%\n` +
    ranked.map(r => `${TYPES[r.k].name} ${r.pct}%`).join(' · ') +
    `\n${TYPES[top.k].advice}\n——你也来测测你是什么样的人`;
};
